<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex,noai,noimageai">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>선도구매 재고 견적요청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#dde2ea;
  --ink:#141c2b; --ink-2:#4c5669; --ink-3:#8a93a4;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --warn:#b42318; --warn-soft:#fde8e6;
  --shadow:0 1px 2px rgba(20,28,43,.06),0 4px 16px rgba(20,28,43,.06);
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#161d2d; --surface-2:#1d2638; --line:#2a3448;
  --ink:#e8ecf4; --ink-2:#aab3c5; --ink-3:#737e93;
  --accent:#6f95ff; --accent-ink:#0b1020; --accent-soft:#1f2c4d;
  --warn:#ff8a80; --warn-soft:#3b1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2d; --surface-2:#1d2638; --line:#2a3448;
  --ink:#e8ecf4; --ink-2:#aab3c5; --ink-3:#737e93;
  --accent:#6f95ff; --accent-ink:#0b1020; --accent-soft:#1f2c4d;
  --warn:#ff8a80; --warn-soft:#3b1a18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.g-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 24px 22px;display:grid;gap:14px}
.g-card h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.g-sub{margin:-6px 0 4px;color:var(--ink-2);font-size:13px}
.g-f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.g-f input{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:15px;font-weight:500}
.g-f input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.g-chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;justify-self:start}
.g-chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.g-btn{height:48px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.g-btn:disabled{opacity:.5;cursor:default}
.g-msg{min-height:1.2em;font-size:13px;color:var(--ink-2)}
.g-msg.err{color:var(--warn);font-weight:600}
.g-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.g-link{border:0;background:none;color:var(--ink-3);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 0}
.g-link:hover{color:var(--accent)}
.g-mode{font-size:12px;font-weight:700;color:var(--accent)}
.g-up{display:grid;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:13px;color:var(--ink-2)}
.blk{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#0e1320;color:#e8ecf4;font-family:var(--f-body)}
.blk-c{max-width:460px;text-align:center;display:grid;gap:14px}
.blk-i{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:#3b1a18;color:#ff8a80;font-size:32px;font-weight:700}
.blk h1{margin:0;font-size:22px}
.blk p{margin:0;color:#aab3c5;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="g-card" id="gForm" autocomplete="on" novalidate>
    <h1 id="gTitle">로그인</h1>
    <p class="g-sub" id="gSub">등록된 이메일 주소로 로그인해 주세요.</p>
    <label class="g-f">이메일<input id="gEmail" type="email" inputmode="email" autocomplete="username" placeholder="name@company.com" required></label>
    <label class="g-f" id="gPwRow" hidden>비밀번호<input id="gPw" type="password" autocomplete="current-password"></label>
    <label class="g-chk"><input type="checkbox" id="gSave"> 아이디 저장</label>
    <button class="g-btn" id="gGo" type="submit">로그인</button>
    <div class="g-msg" id="gMsg" role="status" aria-live="polite"></div>
    <div class="g-up" id="gUp" hidden>
      <b>화면 파일 등록 필요</b>
      <span>전달받은 화면 파일(app-bundle.json)을 선택하면 서버에 등록되고 바로 열립니다.</span>
      <input type="file" id="gUpFile" accept=".json,application/json">
    </div>
    <div class="g-foot"><span class="g-mode" id="gModeLbl">영업 담당자</span><button class="g-link" id="gMode" type="button">관리자 로그인</button></div>
  </form>
</div>
<div id="app" hidden></div>
<script>
(function(){
'use strict';
var CFG = {url: 'https://eicishonomqyyozdifsw.supabase.co', key: 'sb_publishable_MNvwxbwUTbkoisLu_3TKcA_D94jGxWc'};
var K = {sess: 'qw_s', adm: 'qw_a', mail: 'qw_m', amail: 'qw_am', blk: 'qw_b', msg: 'qw_msg'};
var LS = {
  get: function(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set: function(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
var $ = function(id){ return document.getElementById(id); };
var SESS = LS.get(K.sess), ADM = LS.get(K.adm), BLOCKED = false, MOUNTED = false, adminMode = false, HB = null, EXPT = null;

/* ---------- 서버 호출 ---------- */
function rpc(fn, args, jwt){
  var h = {'apikey': CFG.key, 'Content-Type': 'application/json'};
  if (jwt) h.Authorization = 'Bearer ' + jwt;
  return fetch(CFG.url + '/rest/v1/rpc/' + fn, {method: 'POST', headers: h, body: JSON.stringify(args || {}), cache: 'no-store'})
    .then(function(r){ return r.text().then(function(t){
      var j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
      if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('서버 오류 ' + r.status));
      return j;
    }); });
}
function authReq(grant, body){
  return fetch(CFG.url + '/auth/v1/token?grant_type=' + grant, {
    method: 'POST', headers: {'apikey': CFG.key, 'Content-Type': 'application/json'}, body: JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(j){
    if (!r.ok || !j.access_token) throw new Error(/invalid/i.test(j.error_description || j.msg || '') ? '이메일 또는 비밀번호가 올바르지 않습니다.' : (j.error_description || j.msg || ('로그인 실패 ' + r.status)));
    return {jwt: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000};
  }); });
}
function adminToken(){
  if (!ADM) return Promise.reject(new Error('관리자 로그인이 필요합니다.'));
  if (Date.now() < ADM.exp) return Promise.resolve(ADM.jwt);
  return authReq('refresh_token', {refresh_token: ADM.refresh}).then(function(a){ ADM = a; LS.set(K.adm, a); return a.jwt; })
    .catch(function(){ expire('관리자 로그인이 만료되었습니다. 다시 로그인해 주세요.'); throw new Error('관리자 로그인 만료'); });
}

/* ---------- 비정상 접근 감지 ---------- */
var BOT_RE = /HeadlessChrome|PhantomJS|Puppeteer|Playwright|Selenium|WebDriver|\bbot\b|bot\/|crawl|spider|slurp|GPTBot|ChatGPT|OAI-Search|Claude|anthropic|Perplexity|Bytespider|CCBot|Diffbot|Amazonbot|python|curl\/|wget|httpclient|okhttp|axios|node-fetch|Go-http|Java\//i;
var GLOBAL_RE = /^(__playwright|__pw|__puppeteer|puppeteer|cdc_|\$cdc_|__webdriver|__selenium|__driver|__fxdriver|_Selenium|calledSelenium|_WEBDRIVER|__lastWatirAlert|__nightmare|domAutomation|_phantom|callPhantom|Cypress)/i;
function autoCheck(){
  var n = navigator, w = window, d = document, r = [];
  try {
    if (n.webdriver) r.push('webdriver');
    if (BOT_RE.test(n.userAgent || '')) r.push('user-agent');
    var de = d.documentElement;
    if (de.getAttribute('webdriver') || de.getAttribute('selenium') || de.getAttribute('driver')) r.push('dom-attr');
    Object.getOwnPropertyNames(w).forEach(function(k){ if (GLOBAL_RE.test(k)) r.push(k); });
    Object.getOwnPropertyNames(d).forEach(function(k){ if (GLOBAL_RE.test(k)) r.push(k); });
    if (n.languages !== undefined && n.languages.length === 0) r.push('languages');
  } catch(e){}
  return r;
}
function devtoolsOpen(){
  var t = performance.now();
  try { (function(){}).constructor('debugger')(); } catch(e){}
  return performance.now() - t > 150;
}
function showBlock(){
  document.title = '접근 제한';
  document.body.className = '';
  document.body.innerHTML = '<div class="blk"><div class="blk-c"><div class="blk-i">!</div>' +
    '<h1>비정상적인 접근이 감지되었습니다</h1>' +
    '<p>자동화 도구, 개발자 도구, 데이터 수집·분석 프로그램을 통한 접근은 허용되지 않습니다.<br>접근 기록이 관리자에게 전달되었습니다.</p>' +
    '<p>정상적인 이용 중이었다면 30분 뒤 일반 브라우저로 다시 접속하거나 관리자에게 문의해 주세요.</p></div></div>';
}
function block(reason){
  if (BLOCKED) return; BLOCKED = true;
  var tk = SESS && SESS.token, em = (SESS && SESS.email) || ($('gEmail') && $('gEmail').value) || '';
  clearInterval(HB); clearTimeout(EXPT);
  LS.set(K.sess, null); LS.set(K.adm, null); LS.set(K.blk, Date.now() + 30 * 60000);
  showBlock();
  var done = function(){ location.reload(); };
  var t = setTimeout(done, 1500);
  rpc('qw_report', {p_token: tk || null, p_email: em, p_reason: reason, p_ua: navigator.userAgent})
    .then(function(){ clearTimeout(t); done(); }, function(){ clearTimeout(t); done(); });
}
function guard(){
  var bad = autoCheck();
  if (bad.length) { block('자동화 도구 감지 : ' + bad.slice(0, 5).join(', ')); return false; }
  if (devtoolsOpen()) { block('개발자 도구 사용 감지'); return false; }
  return true;
}
document.addEventListener('keydown', function(e){
  var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
  if (k === 'f12' || (c && e.shiftKey && (k === 'i' || k === 'j' || k === 'c' || k === 'k')) || (c && e.altKey && (k === 'i' || k === 'j' || k === 'c' || k === 'u')) || (c && (k === 'u' || k === 's'))) {
    e.preventDefault(); e.stopPropagation();
  }
}, true);
document.addEventListener('contextmenu', function(e){
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  e.preventDefault();
}, true);
document.addEventListener('dragstart', function(e){ if (e.target && e.target.tagName === 'IMG') e.preventDefault(); }, true);

/* ---------- 로그인 화면 ---------- */
function msg(t, err){ var m = $('gMsg'); if (!m) return; m.textContent = t || ''; m.className = 'g-msg' + (err ? ' err' : ''); }
function busy(on){ $('gGo').disabled = !!on; }
function fillSaved(){
  var s = LS.get(adminMode ? K.amail : K.mail);
  $('gSave').checked = !!(s && s.on);
  $('gEmail').value = (s && s.on && s.email) || '';
}
function setMode(admin){
  adminMode = !!admin;
  $('gPwRow').hidden = !adminMode; $('gPw').value = '';
  $('gTitle').textContent = adminMode ? '관리자 로그인' : '로그인';
  $('gSub').textContent = adminMode ? '관리자 이메일과 비밀번호를 입력해 주세요.' : '등록된 이메일 주소로 로그인해 주세요.';
  $('gModeLbl').textContent = adminMode ? '관리자' : '영업 담당자';
  $('gMode').textContent = adminMode ? '영업 담당자 로그인' : '관리자 로그인';
  $('gUp').hidden = true; msg('');
  fillSaved();
  ($('gEmail').value ? (adminMode ? $('gPw') : $('gEmail')) : $('gEmail')).focus();
}
function rememberEmail(email){
  LS.set(adminMode ? K.amail : K.mail, $('gSave').checked ? {on: true, email: email} : null);
}
function showGate(text, err){
  $('gate').hidden = false; $('app').hidden = true;
  setMode(false);
  if (text) msg(text, err);
}
$('gMode').onclick = function(){ setMode(!adminMode); };
$('gForm').addEventListener('submit', function(e){
  e.preventDefault();
  if (!guard()) return;
  var email = $('gEmail').value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg('이메일 주소를 정확히 입력해 주세요.', true); $('gEmail').focus(); return; }
  busy(true); msg('로그인 중…');
  if (!adminMode) {
    rpc('qw_login', {p_email: email, p_ua: navigator.userAgent}).then(function(r){
      busy(false);
      if (!r || !r.ok) {
        msg(r && r.code === 'locked' ? '로그인 시도가 너무 많거나 비정상 접근 기록이 있어 잠시 제한되었습니다. 잠시 후 다시 시도해 주세요.' : '등록되지 않은 이메일입니다. 관리자에게 권한 등록을 요청해 주세요.', true);
        return;
      }
      rememberEmail(email); startSession(r);
    }).catch(function(err){ busy(false); msg('서버에 연결하지 못했습니다. (' + err.message + ')', true); });
  } else {
    var pw = $('gPw').value;
    if (!pw) { busy(false); msg('비밀번호를 입력해 주세요.', true); $('gPw').focus(); return; }
    authReq('password', {email: email, password: pw}).then(function(a){
      ADM = a; LS.set(K.adm, a);
      return rpc('qw_admin_login', {p_ua: navigator.userAgent}, a.jwt);
    }).then(function(r){
      busy(false);
      if (!r || !r.ok) { ADM = null; LS.set(K.adm, null); msg('관리자 권한이 없는 계정입니다.', true); return; }
      rememberEmail(email); startSession(r);
    }).catch(function(err){ busy(false); ADM = null; LS.set(K.adm, null); msg(err.message, true); });
  }
});

/* ---------- 세션 · 화면 불러오기 ---------- */
function startSession(r){
  SESS = {token: r.token, email: r.email, company: r.company || '', name: r.name || '', expires: r.expires, admin: !!r.admin};
  LS.set(K.sess, SESS);
  launch();
}
function launch(){
  msg('화면을 불러오는 중…'); busy(true);
  rpc('qw_get', {p_token: SESS.token, p_kind: 'app'}).then(function(r){
    busy(false);
    if (!r || !r.ok) { expire('로그인이 만료되었습니다. 다시 로그인해 주세요.'); return; }
    if (!r.body || !r.body.js) {
      if (SESS.admin) { $('gUp').hidden = false; msg('서버에 화면 파일이 아직 없습니다.'); }
      else msg('화면을 준비 중입니다. 관리자에게 문의해 주세요.', true);
      return;
    }
    mount(r.body);
  }).catch(function(err){ busy(false); msg('서버에 연결하지 못했습니다. (' + err.message + ')', true); });
}
function mount(b){
  if (MOUNTED) return; MOUNTED = true;
  var st = document.createElement('style'); st.textContent = b.css || ''; document.head.appendChild(st);
  $('app').innerHTML = b.html || '';
  $('gate').hidden = true; $('app').hidden = false;
  try { (new Function('SHELL', b.js))(API); }
  catch(err){ $('app').hidden = true; $('gate').hidden = false; msg('화면 실행 오류 : ' + err.message, true); return; }
  startTimers();
}
function uploadApp(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ try { res(JSON.parse(fr.result)); } catch(e){ rej(new Error('화면 파일 형식이 올바르지 않습니다.')); } };
    fr.onerror = function(){ rej(new Error('파일을 읽지 못했습니다.')); };
    fr.readAsText(file, 'utf-8');
  }).then(function(b){
    if (!b || !b.js || !b.html) throw new Error('화면 파일(app-bundle.json)이 아닙니다.');
    return adminToken().then(function(t){ return rpc('qw_admin_put', {p_kind: 'app', p_body: b}, t); }).then(function(){ return b; });
  });
}
$('gUpFile').addEventListener('change', function(){
  var f = this.files && this.files[0]; this.value = ''; if (!f) return;
  msg('화면 파일 등록 중…');
  uploadApp(f).then(function(b){ $('gUp').hidden = true; msg(''); mount(b); }).catch(function(err){ msg(err.message, true); });
});

/* ---------- 로그인 유지 확인 · 매일 06시 자동 로그아웃 ---------- */
var REASON = {
  '자동 로그아웃(06시)': '매일 오전 6시에 자동 로그아웃됩니다. 다시 로그인해 주세요.',
  '권한 삭제': '접속 권한이 해제되었습니다. 관리자에게 문의해 주세요.',
  '강제 로그아웃': '관리자에 의해 로그아웃되었습니다.',
  '이메일 변경': '등록 이메일이 변경되었습니다. 새 이메일로 로그인해 주세요.',
  '비정상 접근': '비정상 접근으로 로그아웃되었습니다.',
  '로그아웃': '로그아웃되었습니다.'
};
function heartbeat(){
  if (!SESS || BLOCKED) return;
  if (SESS.expires && Date.now() >= new Date(SESS.expires).getTime()) { expire(REASON['자동 로그아웃(06시)']); return; }
  rpc('qw_session', {p_token: SESS.token}).then(function(r){
    if (r && r.ok) return;
    expire(REASON[r && r.reason] || '로그인이 만료되었습니다. 다시 로그인해 주세요.');
  }).catch(function(){});
}
function startTimers(){
  clearInterval(HB); HB = setInterval(function(){ if (guard()) heartbeat(); }, 60000);
  clearTimeout(EXPT);
  var left = SESS && SESS.expires ? new Date(SESS.expires).getTime() - Date.now() : 0;
  if (left > 0 && left < 2147000000) EXPT = setTimeout(function(){ expire(REASON['자동 로그아웃(06시)']); }, left + 1000);
  setInterval(function(){ if (!BLOCKED && devtoolsOpen()) block('개발자 도구 사용 감지'); }, 1500);
}
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && MOUNTED && guard()) heartbeat(); });
function clearLocal(){ SESS = null; ADM = null; LS.set(K.sess, null); LS.set(K.adm, null); }
function expire(text){
  clearInterval(HB); clearTimeout(EXPT);
  clearLocal();
  try { sessionStorage.setItem(K.msg, text || ''); } catch(e){}
  location.reload();
}
function logout(){
  var tk = SESS && SESS.token;
  var go = function(){ expire(REASON['로그아웃']); };
  if (!tk) return go();
  var t = setTimeout(go, 1500);
  rpc('qw_logout', {p_token: tk}).then(function(){ clearTimeout(t); go(); }, function(){ clearTimeout(t); go(); });
}

/* ---------- 화면(앱)에 넘겨주는 기능 ---------- */
var API = {
  profile: function(){ return SESS ? {email: SESS.email, company: SESS.company, name: SESS.name, admin: SESS.admin, expires: SESS.expires} : null; },
  isAdmin: function(){ return !!(SESS && SESS.admin && ADM); },
  get: function(kind){
    return rpc('qw_get', {p_token: SESS.token, p_kind: kind}).then(function(r){
      if (!r || !r.ok) { if (r && r.code === 'auth') heartbeat(); throw new Error('데이터를 불러오지 못했습니다.'); }
      return r.body;
    });
  },
  adminToken: adminToken,
  adminRpc: function(fn, args){ return adminToken().then(function(t){ return rpc(fn, args || {}, t); }); },
  uploadApp: uploadApp,
  logout: logout,
  server: {url: CFG.url, key: CFG.key}
};

/* ---------- 시작 ---------- */
if ((LS.get(K.blk) || 0) > Date.now()) { BLOCKED = true; showBlock(); return; }
if (!guard()) return;
var note = ''; try { note = sessionStorage.getItem(K.msg) || ''; sessionStorage.removeItem(K.msg); } catch(e){}
if (SESS && SESS.token && SESS.expires && new Date(SESS.expires).getTime() > Date.now() && (!SESS.admin || ADM)) {
  showGate(); $('gate').hidden = false; msg('로그인 확인 중…'); busy(true);
  rpc('qw_session', {p_token: SESS.token}).then(function(r){
    busy(false);
    if (!r || !r.ok) { clearLocal(); showGate(REASON[r && r.reason] || '로그인이 만료되었습니다. 다시 로그인해 주세요.', true); return; }
    SESS.company = r.company || ''; SESS.name = r.name || ''; SESS.expires = r.expires; LS.set(K.sess, SESS);
    launch();
  }).catch(function(err){ busy(false); msg('서버에 연결하지 못했습니다. (' + err.message + ')', true); });
} else {
  clearLocal();
  showGate(note, false);
}
})();
</script>
</body>
</html>
